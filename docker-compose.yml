# Yerel geliştirme: `docker compose up -d` → API http://localhost:8080, Mailpit http://localhost:8025
name: nirengi

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nirengi
      POSTGRES_USER: nirengi
      POSTGRES_PASSWORD: nirengi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nirengi -d nirengi"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: ./backend
      dockerfile: src/Host/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=nirengi;Username=nirengi;Password=nirengi
      Database__MigrateOnStartup: "true"
      Smtp__Host: mailpit
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
