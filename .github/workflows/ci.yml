name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for every job; none of them writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.28.0
          # SHA-256 of gitleaks_8.28.0_linux_x64.tar.gz from the release's checksums file. Update both together.
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --no-banner --redact

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: backend/global.json
      - name: Restore
        run: dotnet restore Nirengi.slnx
      - name: Vulnerable packages (direct and transitive)
        # `dotnet list package --vulnerable` exits 0 even when it finds something, so read its output.
        run: |
          report=$(dotnet list Nirengi.slnx package --vulnerable --include-transitive 2>&1) || { echo "$report"; exit 1; }
          echo "$report"
          if echo "$report" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet packages found (see the list above)."
            exit 1
          fi
      - name: Build (warnings are errors)
        run: dotnet build Nirengi.slnx --no-restore -c Release
      - name: OpenAPI contract is up to date
        working-directory: .
        run: git diff --exit-code -- contracts/openapi || (echo "::error::contracts/openapi is stale. Build locally and commit the regenerated file." && exit 1)
      - name: Unit and architecture tests
        run: |
          dotnet test --project tests/ArchitectureTests --no-build -c Release
          dotnet test --project tests/Analytics.GoldenTests --no-build -c Release
          dotnet test --project tests/BuildingBlocks.UnitTests --no-build -c Release
          dotnet test --project tests/Identity.UnitTests --no-build -c Release
          dotnet test --project tests/Curriculum.UnitTests --no-build -c Release
          dotnet test --project tests/Tracking.UnitTests --no-build -c Release
          dotnet test --project tests/Recommendation.UnitTests --no-build -c Release
      - name: Integration tests (Testcontainers)
        run: dotnet test --project tests/Host.IntegrationTests --no-build -c Release

  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build API image
        run: docker build -f backend/src/Host/Dockerfile -t nirengi-api:ci .

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - run: flutter pub get
      - name: Generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart format lib
          git diff --exit-code -- lib
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - name: Dependency vulnerabilities (high and above fail)
        run: npm audit --audit-level=high
      - run: npm run lint
      - name: API types match the contract
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm test
      - run: npm run build
