# Production compose, Caddy, roles SQL and deploy scripts on every change to them (ADR-0022, F2 card 11).
name: deploy-smoke

on:
  pull_request:
    paths:
      - "deploy/**"
      - "backend/src/Host/Dockerfile"
      - "backend/src/**/Migrations/**"
      - ".github/workflows/deploy-smoke.yml"
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "backend/src/Host/Dockerfile"
      - "backend/src/**/Migrations/**"
      - ".github/workflows/deploy-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: shellcheck deploy scripts
        run: shellcheck --severity=style deploy/bin/*.sh deploy/ci/*.sh

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build the API image as GHCR would name it
        run: docker build -t ghcr.io/ci/nirengi-api:0.0.0-ci --build-arg VERSION=0.0.0-ci -f backend/src/Host/Dockerfile .
      - name: Caddyfile is valid
        run: docker run --rm -e NIRENGI_API_HOST=api.example.com -e ACME_EMAIL=ci@example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.8-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Bring production compose up and check /health/ready through Caddy
        run: deploy/ci/smoke.sh ci 0.0.0-ci
