name: Android APK (test)

# Manual: Actions → "Android APK (test)" → Run workflow. Builds a debug APK that talks to the API at the
# address you give (e.g. the PC running `docker compose up`). Debug builds allow plain HTTP; release builds do not.
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API address the app connects to, e.g. http://192.168.1.20:8080"
        required: true
        type: string

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - run: flutter pub get
      - name: Build debug APK
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: flutter build apk --debug --dart-define=API_BASE_URL="$API_BASE_URL"
      - uses: actions/upload-artifact@v5
        with:
          name: nirengi-test-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
