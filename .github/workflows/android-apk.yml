name: Android APK (preview)

# Builds a debug APK for every PR that touches mobile/ and publishes it as a pre-release `preview-pr-<n>`.
# A bot comment on the PR links the APK (plus a QR code) so it can be installed from the phone in one tap.
# All debug APKs share the committed key mobile/android/app/preview-debug.keystore, so each new build
# installs as an update over the previous one (no uninstall, local data kept).
#
# The API address comes from the repository variable API_BASE_URL (e.g. http://192.168.1.20:8080, the PC
# running `docker compose up`). Manual runs may override it. Debug builds allow plain HTTP; release builds do not.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API address (empty = repository variable API_BASE_URL)"
        required: false
        type: string

concurrency:
  group: android-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Resolve API address
        working-directory: .
        env:
          INPUT_URL: ${{ inputs.api_base_url }}
          VAR_URL: ${{ vars.API_BASE_URL }}
        run: |
          url="${INPUT_URL:-$VAR_URL}"
          if [ -z "$url" ]; then
            echo "::error::Set the repository variable API_BASE_URL (Settings → Secrets and variables → Actions → Variables), e.g. http://192.168.1.20:8080"
            exit 1
          fi
          echo "API_BASE_URL=$url" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - run: flutter pub get
      - name: Build debug APK
        # run_number keeps versionCode increasing, so Android always accepts the new APK as an update.
        run: flutter build apk --debug --build-number=${{ github.run_number }} --dart-define=API_BASE_URL="$API_BASE_URL"
      - uses: actions/upload-artifact@v5
        with:
          name: nirengi-test-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
      - name: Publish pre-release and comment on PR
        # Fork PRs get a read-only token; they still have the artifact above.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          tag="preview-pr-$PR"
          apk="nirengi-pr-$PR.apk"
          cp build/app/outputs/flutter-apk/app-debug.apk "$apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
            gh release edit "$tag" --target "$SHA" --notes "PR #$PR · ${SHA:0:7} · API: $API_BASE_URL"
          else
            gh release create "$tag" "$apk" --prerelease --target "$SHA" \
              --title "Mobil önizleme · PR #$PR" --notes "PR #$PR · ${SHA:0:7} · API: $API_BASE_URL"
          fi
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$apk"
          qr="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=$(jq -rn --arg u "$url" '$u|@uri')"
          body=$(printf '%s\n' \
            "### 📱 Mobil önizleme" \
            "" \
            "Telefondan **[$apk]($url)** linkine dokun, inen dosyayı aç, **Güncelle** de." \
            "" \
            "![QR]($qr)" \
            "" \
            "Commit \`${SHA:0:7}\` · run #$GITHUB_RUN_NUMBER · API \`$API_BASE_URL\`")
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "$body"

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete preview pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh release delete "preview-pr-$PR" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
